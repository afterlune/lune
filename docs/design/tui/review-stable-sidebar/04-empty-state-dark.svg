<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="920" viewBox="0 0 1300 920">
  <style>
    .canvas { fill: #111417; }
    .screen { fill: #151a1f; stroke: #343b43; stroke-width: 2; }
    .rule { stroke: #343b43; stroke-width: 2; }
    .main { fill: #e6edf3; font: 19px "Cascadia Mono", "Consolas", monospace; }
    .small { fill: #a4adb8; font: 17px "Cascadia Mono", "Consolas", monospace; }
    .label { fill: #71d5c4; font: bold 20px "Cascadia Mono", "Consolas", monospace; }
  </style>
  <rect class="canvas" x="0" y="0" width="1300" height="920"/>
  <text class="label" x="60" y="42">EMPTY STATE · STABLE SIDEBAR</text>
  <rect class="screen" x="60" y="64" width="1180" height="836" rx="8"/>
  <text class="main" x="90" y="108">Agent workspace · Ready</text>
  <text class="small" x="1010" y="108">D:/work/project</text>
  <line class="rule" x1="60" y1="142" x2="1240" y2="142"/>
  <line class="rule" x1="840" y1="142" x2="840" y2="790"/>

  <text class="main" x="90" y="194">Start a task, or use /resume to browse saved sessions.</text>

  <text class="label" x="875" y="178">Activity</text>
  <text class="small" x="875" y="214">No tool activity yet.</text>
  <line class="rule" x1="875" y1="620" x2="1210" y2="620"/>
  <text class="label" x="875" y="642">Usage</text>
  <text class="small" x="875" y="672">Input</text><text class="main" x="1160" y="672">—</text>
  <text class="small" x="875" y="696">Output</text><text class="main" x="1160" y="696">—</text>
  <text class="small" x="875" y="720">Reasoning</text><text class="main" x="1160" y="720">—</text>
  <text class="small" x="875" y="744">Total</text><text class="main" x="1160" y="744">—</text>
  <text class="small" x="875" y="768">Cached</text><text class="main" x="1160" y="768">—</text>

  <line class="rule" x1="60" y1="790" x2="1240" y2="790"/>
  <text class="small" x="90" y="832">›  Ask anything...</text>
  <text class="small" x="90" y="872">Enter send · Ctrl+0 newline · Shift+Tab permissions · /plan</text>
</svg>
