<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="564" viewBox="0 0 1104 564"><rect width="100%" height="100%" fill="#171a1e"/><g fill="#f0f1f2" font-family="Cascadia Mono, Consolas, monospace" font-size="14" style="white-space:pre"><text xml:space="preserve" x="12" y="27"><tspan font-weight="bold">Agent workspace</tspan> · <tspan fill="#78aaa2">Ready</tspan>                                                                                                 </text><text xml:space="preserve" x="12" y="45">                                                                                <tspan fill="#a7b1ba" font-weight="bold">▸ YOU</tspan> <tspan fill="#9aa3ad">│</tspan> <tspan fill="#78aaa2" font-weight="bold">Activity</tspan>                        </text><text xml:space="preserve" x="12" y="63">                       Please review the complete configuration lifecycle and confirm <tspan fill="#9aa3ad">│</tspan> No tool activity yet.           </text><text xml:space="preserve" x="12" y="81">                                the user request remains readable in the conversation <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="99">                                                                          transcript. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="117">                         Check how the output wraps across lines while the marker and <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="135">                       message body keep their expected alignment on a wide terminal. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="153">                           The collapsed preview should preserve the original wording <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="171">                                 without bolding or recoloring the message body text. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="189">                       The Activity and Usage panels should remain steady as the long <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="207">                           request grows and the assistant response appears below it. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="225">                        Expanding the request should reveal every line and retain the <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="243">                              Show less control without shifting neighboring content. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="261">                        This final sentence makes the fixture long enough to exercise <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="279">                                     both the line and character collapse thresholds. <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="297">                        <tspan fill="#9aa3ad">Show less</tspan>                                                     <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="315">                                                                                      <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="333">The assistant response stays on the left.                                             <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="351">                                                                                      <tspan fill="#9aa3ad">│</tspan>                                 </text><text xml:space="preserve" x="12" y="369">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">────────────────────────────────</tspan></text><text xml:space="preserve" x="12" y="387">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#78aaa2" font-weight="bold">Usage</tspan>                           </text><text xml:space="preserve" x="12" y="405">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">Input</tspan>                          —</text><text xml:space="preserve" x="12" y="423">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">Output</tspan>                         —</text><text xml:space="preserve" x="12" y="441">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">Reasoning</tspan>                      —</text><text xml:space="preserve" x="12" y="459">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">Total</tspan>                          —</text><text xml:space="preserve" x="12" y="477">                                                                                      <tspan fill="#9aa3ad">│</tspan> <tspan fill="#9aa3ad">Cached</tspan>                         —</text><text xml:space="preserve" x="12" y="495"><tspan fill="#9aa3ad">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text xml:space="preserve" x="12" y="513"><tspan fill="#78aaa2">┃ </tspan><tspan fill="#9aa3ad">Ask anything, or paste ResponseInput JSON...</tspan>                                                                          </text><text xml:space="preserve" x="12" y="531"><tspan fill="#78aaa2">┃ </tspan><tspan fill="#9aa3ad"> </tspan>                                                                                                                     </text><text xml:space="preserve" x="12" y="549"><tspan fill="#9aa3ad">enter send · ctrl+o newline · shift+tab permissions · /plan · ctrl+b activity · alt+m fold latest long message</tspan>          </text></g></svg>
