<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1420" viewBox="0 0 1960 1420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <style>
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .terminal { fill: #0b1117; stroke: #2c343d; stroke-width: 1.5; }
      .text { fill: #e7dfd3; }
      .muted { fill: #948f88; }
      .accent { fill: #d29a5a; }
      .green { fill: #9fbd91; }
      .red { fill: #d68170; }
      .line { fill: #38414a; }
      .input { fill: #18212a; stroke: #56616c; stroke-width: 1; }
      .code { fill: #b7c6d3; }
      .panel-label { fill: #d29a5a; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
      .small { font-size: 15px; }
      .normal { font-size: 17px; }
      .title { font-size: 22px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1960" height="1420" fill="#f0ebe3"/>
  <text x="52" y="58" class="sans" fill="#292d31" font-size="32" font-weight="700">MCP · TUI 状态设计评审</text>
  <text x="54" y="91" class="sans" fill="#69645d" font-size="17">同一会话工作区中的六个状态；保持时间线、暖色强调与现有终端密度。</text>

  <!-- panel 1: list -->
  <g transform="translate(48 128)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="374" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Ready</text><text x="886" y="38" text-anchor="end" class="mono small muted">workspace: lune-agent</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="28" y="91" class="mono title accent">MCP servers</text>
    <text x="30" y="128" class="mono normal text">NAME             TRANSPORT         STATE           TOOLS</text>
    <text x="30" y="157" class="mono normal text">docs             streamable-http   <tspan class="green">enabled</tspan>         4</text>
    <text x="30" y="186" class="mono normal text">local-search     stdio             <tspan class="muted">disabled</tspan>       —</text>
    <text x="30" y="225" class="mono small muted">docs · https://mcp.example.test/v1/mcp</text>
    <text x="30" y="251" class="mono small muted">local-search · mcp-local-search --root ./docs</text>
    <line x1="24" y1="278" x2="886" y2="278" class="line"/>
    <text x="28" y="312" class="mono normal accent">/mcp enable &lt;name&gt;   /mcp disable &lt;name&gt;   /mcp auth &lt;name&gt;</text>
    <text x="28" y="343" class="mono small muted">Only enabled servers are started and exposed to the model.</text>
  </g>
  <text x="48" y="526" class="sans panel-label">01 · 列表与状态</text>

  <!-- panel 2: enable -->
  <g transform="translate(1002 128)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="374" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Ready</text><text x="886" y="38" text-anchor="end" class="mono small muted">MCP</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="28" y="95" class="mono normal text">$ /mcp enable local-search</text>
    <text x="28" y="135" class="mono title accent">Starting local-search</text>
    <text x="30" y="174" class="mono small muted">transport</text><text x="205" y="174" class="mono normal text">stdio</text>
    <text x="30" y="202" class="mono small muted">command</text><text x="205" y="202" class="mono normal code">mcp-local-search --root ./docs</text>
    <text x="30" y="230" class="mono small muted">tools discovered</text><text x="205" y="230" class="mono normal text">3</text>
    <text x="30" y="258" class="mono small muted">permissions</text><text x="205" y="258" class="mono normal text">Network · approval follows current mode</text>
    <line x1="24" y1="280" x2="886" y2="280" class="line"/>
    <text x="28" y="315" class="mono normal green">Enabled for this workspace · 3 tools added to the mcp category.</text>
    <text x="28" y="344" class="mono small muted">State saved in .luneagent/mcp-enabled.json</text>
  </g>
  <text x="1002" y="526" class="sans panel-label">02 · 明确启用与连接结果</text>

  <!-- panel 3: OAuth -->
  <g transform="translate(48 572)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="374" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Ready</text><text x="886" y="38" text-anchor="end" class="mono small muted">MCP · OAuth</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="28" y="96" class="mono normal text">$ /mcp auth docs</text>
    <text x="28" y="137" class="mono title accent">Authorize docs</text>
    <text x="30" y="178" class="mono small muted">authorization server</text><text x="255" y="178" class="mono normal text">login.example.test</text>
    <text x="30" y="207" class="mono small muted">requested scopes</text><text x="255" y="207" class="mono normal text">documents:read</text>
    <text x="30" y="236" class="mono small muted">callback</text><text x="255" y="236" class="mono normal code">127.0.0.1 · PKCE S256</text>
    <rect x="26" y="266" width="858" height="48" rx="7" class="input"/>
    <text x="43" y="297" class="mono normal text">Browser opened · finish sign-in, then return here</text>
    <text x="28" y="347" class="mono small muted">Tokens stay in the OS keyring.</text>
  </g>
  <text x="48" y="970" class="sans panel-label">03 · OAuth 授权状态</text>

  <!-- panel 4: form elicitation -->
  <g transform="translate(1002 572)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="374" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Working · MCP interaction</text><text x="886" y="38" text-anchor="end" class="mono small muted">from docs</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="28" y="94" class="mono title accent">The server needs your input</text>
    <text x="30" y="126" class="mono normal text">Enter a one-time code to continue.</text>
    <text x="30" y="165" class="mono small muted">Code · string · required</text>
    <rect x="28" y="181" width="850" height="49" rx="7" class="input"/>
    <text x="45" y="212" class="mono normal text">▏</text>
    <text x="30" y="265" class="mono small muted">The server supplied this field schema. Review before submitting.</text>
    <line x1="24" y1="290" x2="886" y2="290" class="line"/>
    <text x="28" y="325" class="mono normal accent">Enter submit   Esc cancel</text>
    <text x="394" y="325" class="mono normal muted">Decline</text>
  </g>
  <text x="1002" y="970" class="sans panel-label">04 · 表单式 elicitation</text>

  <!-- panel 5: URL elicitation -->
  <g transform="translate(48 1016)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="350" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Working · MCP interaction</text><text x="886" y="38" text-anchor="end" class="mono small muted">from docs</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="28" y="96" class="mono title accent">Open an external authorization page?</text>
    <text x="30" y="134" class="mono small muted">reason</text><text x="174" y="134" class="mono normal text">Grant access to your document account</text>
    <text x="30" y="165" class="mono small muted">destination</text><text x="174" y="165" class="mono normal code">https://accounts.example.test/consent</text>
    <rect x="28" y="190" width="850" height="55" rx="7" fill="#2b211d" stroke="#7b5740"/>
    <text x="44" y="224" class="mono small" fill="#e6bd8e">Check the site before continuing. Lune will not collect page passwords.</text>
    <line x1="24" y1="266" x2="886" y2="266" class="line"/>
    <text x="28" y="306" class="mono normal green">Y open page</text><text x="226" y="306" class="mono normal red">N decline</text><text x="412" y="306" class="mono normal muted">Esc cancel request</text>
  </g>
  <text x="48" y="1391" class="sans panel-label">05 · URL 模式先展示目标与原因，再由用户确认打开</text>

  <!-- panel 6: rich results -->
  <g transform="translate(1002 1016)" filter="url(#shadow)">
    <rect class="terminal" width="910" height="350" rx="14"/>
    <text x="24" y="38" class="mono normal text">☾ Lune · Ready</text><text x="886" y="38" text-anchor="end" class="mono small muted">MCP result</text>
    <line x1="24" y1="55" x2="886" y2="55" class="line"/>
    <text x="30" y="102" class="mono small accent">ASSISTANT</text>
    <text x="170" y="102" class="mono normal text">Here is the page summary.</text>
    <text x="170" y="135" class="mono normal text">The linked resource was read from the same server.</text>
    <rect x="170" y="158" width="250" height="112" rx="8" fill="#17212a" stroke="#3b4c5a"/>
    <text x="188" y="193" class="mono small muted">IMAGE · image/png</text>
    <text x="188" y="222" class="mono small text">3.4 KiB · MCP attachment</text>
    <text x="30" y="303" class="mono small muted">User-only server notes appear in the transcript and stay out of model context.</text>
  </g>
  <text x="1002" y="1391" class="sans panel-label">06 · 富内容结果与用户专属文本</text>
</svg>
