size="14">  </text><text xml:space="preserve" x="30" y="171" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  请确认分析范围，我会据此继续检查。</text><text xml:space="preserve" x="354" y="171" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                            </text><text xml:space="preserve" x="12" y="189" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="207" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="225" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="243" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="261" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="279" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="297" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="315" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="333" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="351" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="369" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                  </text><text xml:space="preserve" x="12" y="387" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="373" width="864" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="387" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                </text><text xml:space="preserve" x="12" y="405" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="391" width="18" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="405" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="48" y="391" width="243" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="48" y="405" fill="#9a9c9f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">Question 2/2 (1 unanswered)</text><rect x="291" y="391" width="603" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="291" y="405" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                   </text><text xml:space="preserve" x="12" y="423" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="409" width="18" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="423" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="48" y="409" width="306" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="48" y="423" fill="#1c64c8" font-family="Cascadia Mono, Consolas, monospace" font-size="14">无法确认归属的会话，应该如何处理？</text><rect x="354" y="409" width="540" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="354" y="423" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                            </text><text xml:space="preserve" x="12" y="441" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="427" width="864" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="441" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                </text><text xml:space="preserve" x="12" y="459" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="445" width="18" height="16" rx="2" fill="#a4cdfb"/><text xml:space="preserve" x="30" y="459" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="48" y="445" width="243" height="16" rx="2" fill="#a4cdfb"/><text xml:space="preserve" x="48" y="459" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14" font-weight="bold">› 1. 隐藏未确认会话（推荐）</text><rect x="291" y="445" width="18" height="16" rx="2" fill="#a4cdfb"/><text xml:space="preserve" x="291" y="459" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="309" y="445" width="234" height="16" rx="2" fill="#a4cdfb"/><text xml:space="preserve" x="309" y="459" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">只显示归属已经确认的记录。</text><rect x="543" y="445" width="351" height="16" rx="2" fill="#a4cdfb"/><text xml:space="preserve" x="543" y="459" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                       </text><text xml:space="preserve" x="12" y="477" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="463" width="18" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="477" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="48" y="463" width="135" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="48" y="477" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  2. 保留并标记</text><rect x="183" y="463" width="126" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="183" y="477" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">              </text><rect x="309" y="463" width="234" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="309" y="477" fill="#9a9c9f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">保留记录并明确标记未确认。</text><rect x="543" y="463" width="351" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="543" y="477" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                       </text><text xml:space="preserve" x="12" y="495" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="481" width="18" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="495" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="48" y="481" width="198" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="48" y="495" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  3. None of the above</text><rect x="246" y="481" width="63" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="246" y="495" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">       </text><rect x="309" y="481" width="342" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="309" y="495" fill="#9a9c9f" font-family="Cascadia Mono, Consolas, monospace" font-size="14">Optionally, add details in notes (tab)</text><rect x="651" y="481" width="243" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="651" y="495" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                           </text><text xml:space="preserve" x="12" y="513" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="499" width="864" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="513" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">                                                                                                </text><text xml:space="preserve" x="12" y="531" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><rect x="30" y="517" width="18" height="16" rx="2" fill="#f4f4f4"/><text xml:space="preserve" x="30" y="531" fill="#24292F" font-family="Cascadia Mono, Consolas, monospace" font-size="14">  </text><text xml:space="preserve" x="48" y="531" fill="#24292f" font-family="Cascadia Mono, Consolas, monospace" font-size="14" font-weight="bold">tab</text><text xml:space="preserve" x="75" y="531" fill="#9a9c9f" font-family="Cascadia Mono, Consolas, monospace" font-size="14"> to add notes | </text><text xml:space="preserve" x="219" y="531" fill="#2